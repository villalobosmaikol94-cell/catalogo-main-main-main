<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JADARA - Panel de Administración</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fdfbfb; margin: 0; padding: 20px; color: #333; }
        .admin-container { max-width: 600px; margin: 40px auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(181, 124, 124, 0.1); border: 1px solid #f5ebeb; }
        h1 { color: #b57c7c; text-align: center; font-size: 24px; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        .form-group { margin-bottom: 18px; }
        label { display: block; font-weight: 600; margin-bottom: 6px; font-size: 14px; color: #555; }
        input, select, textarea { width: 100%; padding: 12px; border: 1px solid #e1d5d5; border-radius: 8px; box-sizing: border-box; font-family: inherit; font-size: 14px; transition: border-color 0.3s; }
        input:focus, select:focus, textarea:focus { outline: none; border-color: #b57c7c; }
        .btn-guardar { width: 100%; background-color: #b57c7c; color: white; border: none; padding: 14px; border-radius: 25px; font-weight: bold; font-size: 15px; cursor: pointer; transition: background 0.3s, transform 0.2s; margin-top: 10px; }
        .btn-guardar:active { transform: scale(0.98); }
        .alerta { padding: 12px; border-radius: 8px; text-align: center; margin-bottom: 15px; font-size: 14px; display: none; }
        .alerta-exito { background-color: #e8f5e9; color: #2e7d32; border: 1px solid #c8e6c9; }
    </style>
</head>
<body>

    <div class="admin-container">
        <h1>Añadir Producto - JADARA</h1>
        
        <div id="alerta-exito" class="alerta alerta-exito">✨ ¡Producto añadido al catálogo con éxito!</div>

        <form id="form-producto" onsubmit="guardarProducto(event)">
            <div class="form-group">
                <label for="nombre">Nombre del Producto</label>
                <input type="text" id="nombre" required placeholder="Ej. Cartera Cuero Elegante">
            </div>

            <div class="form-group">
                <label for="precio">Precio (en COP)</label>
                <input type="number" id="precio" required placeholder="Ej. 120000">
            </div>

            <div class="form-group">
                <label for="categoria">Categoría</label>
                <select id="categoria" required>
                    <option value="calzado">👠 Calzado</option>
                    <option value="carteras">👜 Carteras</option>
                    <option value="belleza">💄 Belleza</option>
                    <option value="gorras">🧢 Gorras</option>
                    <option value="ropa">👗 Ropa</option>
                    <option value="tecnologia">📱 Tecnología</option>
                </select>
            </div>

            <div class="form-group">
                <label for="imagen">Enlace (URL) de la Imagen</label>
                <input type="url" id="imagen" required placeholder="https://ejemplo.com">
            </div>

            <button type="submit" class="btn-guardar">🚀 Añadir al Catálogo</button>
        </form>
    </div>

    <script>
        function guardarProducto(e) {
            e.preventDefault();
            
            // Capturamos los datos del formulario
            const nombre = document.getElementById('nombre').value;
            const precio = parseInt(document.getElementById('precio').value);
            const categoria = document.getElementById('categoria').value;
            const imagen = document.getElementById('imagen').value;

            // Creamos el objeto del nuevo producto
            const nuevoProducto = {
                id: Date.now(), // ID único basado en el tiempo
                nombre: nombre,
                precioText: `$${precio.toLocaleString('es-CO')} COP`,
                precioNum: precio,
                categoria: categoria,
                imagen: imagen
            };

            // Traemos los productos guardados antes o creamos una lista vacía
            let productosAdmin = JSON.parse(localStorage.getItem('productosJadaraAdmin')) || [];
            
            // Agregamos el nuevo producto a la lista
            productosAdmin.push(nuevoProducto);

            // Guardamos la lista actualizada en el almacenamiento local
            localStorage.setItem('productosJadaraAdmin', JSON.stringify(productosAdmin));

            // Mostramos alerta de éxito y limpiamos el formulario
            const alerta = document.getElementById('alerta-exito');
            alerta.style.display = 'block';
            document.getElementById('form-producto').reset();

            // Escondemos la alerta después de 3 segundos
            setTimeout(() => { alerta.style.display = 'none'; }, 3000);
        }
    </script>
</body>
</html>
