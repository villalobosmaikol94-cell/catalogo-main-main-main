<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JADARA - Panel Directo Corregido</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fbf7f5; color: #4a3b32; padding: 40px 20px; }
        .container { max-width: 500px; margin: 0 auto; background: white; padding: 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); }
        h2 { color: #b57c7c; text-align: center; margin-bottom: 20px; text-transform: uppercase; letter-spacing: 1px; }
        label { display: block; margin-top: 15px; font-weight: 600; font-size: 0.9rem; }
        input, select, textarea { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #f0e6e1; border-radius: 8px; box-sizing: border-box; font-family: inherit; }
        input[type="file"] { background: #fdfaf9; border: 1px dashed #b57c7c; cursor: pointer; }
        button { width: 100%; background-color: #b57c7c; color: white; border: none; padding: 14px; border-radius: 25px; font-weight: bold; margin-top: 25px; cursor: pointer; transition: background 0.3s; font-size: 1rem; }
        button:hover { background-color: #9e6464; }
        button:disabled { background-color: #dcd1cc; cursor: not-allowed; }
        #estado-carga { font-size: 0.85rem; color: #b57c7c; font-weight: bold; text-align: center; margin-top: 12px; display: none; }
    </style>

    <!-- Scripts de Firebase tradicionales para saltar bloqueos de seguridad locales -->
    <script src="https://gstatic.com"></script>
    <script src="https://gstatic.com"></script>
</head>
<body>

    <div class="container">
        <h2>Panel JADARA</h2>
        <p style="text-align: center; color: #8c7365; font-size: 0.9rem; margin-bottom: 20px;">Agregar nuevo producto (Acceso Directo)</p>
        
        <form id="form-producto">
            <label>Nombre del Producto:</label>
            <input type="text" id="nombre" placeholder="Ej: Nike Shox TL" required>

            <label>Categoría:</label>
            <select id="categoria" required>
                <option value="calzado">Calzado</option>
                <option value="belleza">Belleza</option>
            </select>

            <label>Descripción:</label>
            <textarea id="descripcion" rows="3" placeholder="Detalles, tallas disponibles, colores..." required></textarea>

            <label>Precio:</label>
            <input type="text" id="precio" placeholder="Ej: $170.000 COP" required>

            <label>Seleccionar Foto del Producto:</label>
            <input type="file" id="archivo-imagen" accept="image/*" required>
            <div id="estado-carga">⏳ Subiendo imagen y guardando producto... Por favor espera.</div>

            <button type="submit" id="btn-publicar">Publicar en el Catálogo</button>
        </form>
    </div>

    <script>
        // Configuración oficial de tu Firebase de JADARA
        const firebaseConfig = {
            apiKey: "AIzaSyA-0kfqwKNCZmhH26kqALHuHmkkpp8B56U",
            authDomain: "://firebaseapp.com",
            projectId: "jadara-6628b",
            storageBucket: "jadara-6628b.firebasestorage.app",
            messagingSenderId: "76447900274",
            appId: "1:76447900274:web:6ebb6cd0c4650223e018eb",
            measurementId: "G-7XKD4TE3YC"
        };

        // Inicializar la base de datos de manera segura
        firebase.initializeApp(firebaseConfig);
        const db = firebase.firestore();

        document.getElementById('form-producto').addEventListener('submit', async (e) => {
            e.preventDefault();

            const boton = document.getElementById('btn-publicar');
            const textoCarga = document.getElementById('estado-carga');
            const inputArchivo = document.getElementById('archivo-imagen');
            
            if (inputArchivo.files.length === 0) {
                alert("Por favor selecciona una foto.");
                return;
            }

            boton.disabled = true;
            textoCarga.style.display = "block";

            try {
                // CORREGIDO: Se añade [0] para capturar correctamente el archivo binario de la imagen
                const foto = inputArchivo.files[0];
                const formData = new FormData();
                formData.append("image", foto);

                const apiKeyImgBB = "6db7d47eb3d3e23ff507c57b98d1a1b1"; 

                // Subida directa de la foto a los servidores globales de ImgBB
                const respuestaImg = await fetch('https://imgbb.com' + apiKeyImgBB, {
                    method: "POST",
                    body: formData
                });
                
                const resultadoJson = await respuestaImg.json();

                if (!resultadoJson || !resultadoJson.success) {
                    throw new Error("ImgBB rechazó la imagen. Intenta con otra foto.");
                }

                const urlPublicaImagen = resultadoJson.data.url;

                // Registro dinámico directo en las colecciones de tu base de datos Firebase
                await db.collection("productos").add({
                    nombre: document.getElementById('nombre').value,
                    categoria: document.getElementById('categoria').value,
                    descripcion: document.getElementById('descripcion').value,
                    precio: document.getElementById('precio').value,
                    imagen: urlPublicaImagen,
                    fechaCreacion: new Date()
                });
                
                alert("¡Producto publicado con éxito en JADARA!");
                document.getElementById('form-producto').reset();

            } catch (error) {
                console.error("Error detectado en el proceso: ", error);
                alert("Hubo un error al publicar: " + error.message);
            } finally {
                boton.disabled = false;
                textoCarga.style.display = "none";
            }
        });
    </script>
</body>
</html>
