<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JADARA - Acceso Admin</title>
    <link href="https://googleapis.com" rel="stylesheet">
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fbf7f5; color: #4a3b32; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .login-box { background: white; padding: 40px 30px; border-radius: 16px; box-shadow: 0 4px 15px rgba(0,0,0,0.05); width: 100%; max-width: 380px; text-align: center; }
        h2 { color: #b57c7c; margin-bottom: 25px; text-transform: uppercase; letter-spacing: 1px; }
        input { width: 100%; padding: 12px; margin-top: 10px; border: 1px solid #f0e6e1; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; background-color: #b57c7c; color: white; border: none; padding: 14px; border-radius: 25px; font-weight: bold; margin-top: 25px; cursor: pointer; transition: background 0.3s; }
        button:hover { background-color: #9e6464; }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>JADARA ADMIN</h2>
        <form id="form-login">
            <input type="email" id="correo" placeholder="Correo electrónico" required>
            <input type="password" id="clave" placeholder="Contraseña" required>
            <button type="submit">Ingresar al Panel</button>
        </form>
    </div>

    <script type="module">
        // Importamos las librerías correctas y completas para Autenticación
        import { initializeApp } from "https://gstatic.com";
        import { getAuth, signInWithEmailAndPassword } from "https://gstatic.com";

        // Tus credenciales oficiales de JADARA
        const firebaseConfig = {
            apiKey: "AIzaSyA-0kfqwKNCZmhH26kqALHuHmkkpp8B56U",
            authDomain: "jadara-6628b.firebaseapp.com",
            projectId: "jadara-6628b",
            storageBucket: "jadara-6628b.firebasestorage.app",
            messagingSenderId: "76447900274",
            appId: "1:76447900274:web:6ebb6cd0c4650223e018eb",
            measurementId: "G-7XKD4TE3YC"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);

        // Evento para procesar tu inicio de sesión
        document.getElementById('form-login').addEventListener('submit', (e) => {
            e.preventDefault();
            const correo = document.getElementById('correo').value;
            const clave = document.getElementById('clave').value;

            // Enviar datos a Firebase para comprobar tu contraseña
            signInWithEmailAndPassword(auth, correo, clave)
                .then((userCredential) => {
                    // Si el correo y clave coinciden, te da acceso a tu admin.html
                    window.location.href = "admin.html";
                })
                .catch((error) => {
                    console.error("Error de login:", error);
                    alert("Acceso denegado. Verifica tu correo y contraseña.");
                });
        });
    </script>
</body>
</html>
