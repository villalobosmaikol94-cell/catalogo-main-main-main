<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JADARA - Acceso Administrativo</title>
    <link rel="preconnect" href="https://googleapis.com">
    <link rel="preconnect" href="https://gstatic.com" crossorigin>
    <link href="https://googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #fdfbfb;
            margin: 0;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            color: #333;
            background-image: radial-gradient(rgba(181, 124, 124, 0.05) 1px, transparent 0);
            background-size: 24px 24px;
        }
        .login-card {
            width: 100%;
            max-width: 380px;
            background: white;
            padding: 40px 30px;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(181, 124, 124, 0.08);
            border: 1px solid #f5ebeb;
            box-sizing: border-box;
            text-align: center;
        }
        .logo-login {
            width: 75px;
            height: 75px;
            object-fit: cover;
            border-radius: 50%;
            margin-bottom: 15px;
            border: 1px solid #f3e1e1;
        }
        h1 {
            color: #b57c7c;
            font-size: 22px;
            margin: 0 0 5px 0;
            text-transform: uppercase;
            letter-spacing: 1.5px;
            font-weight: 700;
        }
        p.subtitulo {
            font-size: 13px;
            color: #8c8c8c;
            margin: 0 0 30px 0;
            font-style: italic;
        }
        .form-group {
            margin-bottom: 20px;
            text-align: left;
        }
        label {
            display: block;
            font-weight: 600;
            margin-bottom: 8px;
            font-size: 13px;
            color: #666;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        input {
            width: 100%;
            padding: 14px;
            border: 1px solid #e1d5d5;
            border-radius: 25px;
            box-sizing: border-box;
            font-family: inherit;
            font-size: 14px;
            text-align: center;
            transition: all 0.3s ease;
            background-color: #faf7f7;
        }
        input:focus {
            outline: none;
            border-color: #b57c7c;
            background-color: #ffffff;
            box-shadow: 0 0 8px rgba(181, 124, 124, 0.15);
        }
        .btn-ingresar {
            width: 100%;
            background-color: #b57c7c;
            color: white;
            border: none;
            padding: 14px;
            border-radius: 25px;
            font-weight: bold;
            font-size: 14px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            margin-top: 10px;
            box-shadow: 0 4px 12px rgba(181, 124, 124, 0.2);
        }
        .btn-ingresar:hover { background-color: #a46b6b; }
        .btn-ingresar:active { transform: scale(0.98); }
        .error-mensaje { color: #c62828; font-size: 13px; margin-top: 15px; font-weight: 600; display: none; }
    </style>
</head>
<body>

    <div class="login-card">
        <img src="tulipan.png" alt="JADARA" class="logo-login" onerror="this.style.display='none'">
        <h1>JADARA</h1>
        <p class="subtitulo">Panel de Control Privado</p>

        <form id="form-login" onsubmit="validarAcceso(event)">
            <div class="form-group">
                <label for="password">Contraseña de Administradora</label>
                <input type="password" id="password" required placeholder="••••••••">
            </div>

            <button type="submit" class="btn-ingresar">Entrar al Panel</button>
            <div id="error-txt" class="error-mensaje">❌ Contraseña incorrecta. Inténtalo de nuevo.</div>
        </form>
    </div>

    <script>
        function validarAcceso(e) {
          e.preventDefault();
            const claveDigitada = document.getElementById('password').value;
            const errorTxt = document.getElementById('error-txt');

            // --- TU CONTRASEÑA OFICIAL ---
            const claveCorrecta = "Jadara2026"; 

            if (claveDigitada === claveCorrecta) {
                errorTxt.style.display = 'none';
               window.location.href = "admin.html";
            } else {
                errorTxt.style.display = 'block';
                document.getElementById('password').value = '';
                document.getElementById('password').focus();
            }
        }
    </script>
</body>
</html>
